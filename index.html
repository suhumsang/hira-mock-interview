<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심평원 모의면접 평가표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single column scoring sheet — header form, tab strip, item cards, sticky score bar at bottom */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --ink:#1b2a33; --muted:#5d6f7a; --line:#d8e0e5;
  --accent:#1f5f8b; --accent-ink:#ffffff; --sel:#e3eef6; --warn:#b3261e;
  --sp1:#e07b39; --sp2:#2f5597; --sp3:#3a8f4f; --sp4:#c99700; --sp5:#d6454a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11181d; --panel:#18222a; --ink:#e3eaee; --muted:#93a4ae; --line:#2c3a44;
  --accent:#6fb0dc; --accent-ink:#0d1418; --sel:#1f3444; --warn:#ff8a80;
  --sp1:#f0a066; --sp2:#86a8e8; --sp3:#79c48c; --sp4:#e8c552; --sp5:#f08589; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d; --panel:#18222a; --ink:#e3eaee; --muted:#93a4ae; --line:#2c3a44;
  --accent:#6fb0dc; --accent-ink:#0d1418; --sel:#1f3444; --warn:#ff8a80;
  --sp1:#f0a066; --sp2:#86a8e8; --sp3:#79c48c; --sp4:#e8c552; --sp5:#f08589; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:1.4rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.meta label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:44px;resize:vertical;font-size:.9rem}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab small{font-family:var(--mono);font-size:.75rem;margin-left:4px}
.note{font-size:.85rem;color:var(--muted);margin:0}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sel);border-radius:6px;padding:10px 12px;font-size:.88rem}
.list{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item{font-weight:700}
.chip{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor}
.lv{font-size:.78rem;color:var(--muted)}
.look{margin:0;font-size:.9rem;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sbtn{font:inherit;font-family:var(--mono);font-size:1rem;padding:8px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.sbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.desc{display:grid;gap:4px;font-size:.85rem;margin:0}
.desc div{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:4px 6px;border-radius:4px}
.desc div.on{background:var(--sel)}
.desc b{font-family:var(--mono);font-weight:500;color:var(--muted)}
details{font-size:.85rem;color:var(--muted)}
summary{cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.95rem}
.score strong{font-size:1.25rem}
.flag{font-size:.8rem;font-weight:700}
.flag.low{color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.sp-sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;font-family:var(--mono)}
.out{width:100%;min-height:120px;font-family:var(--mono);font-size:.8rem}
footer{font-size:.78rem;color:var(--muted)}
.metabox>summary{font-weight:500;color:var(--ink);padding:4px 0;list-style-position:inside}
.metabox[open]>summary{margin-bottom:8px}
.metabox .meta{margin-top:4px}
.picked{font-size:.88rem;padding:6px 8px;border-radius:4px;background:var(--sel);margin:0}
.picked b{font-family:var(--mono);font-weight:500;color:var(--muted);margin-right:6px}
.dx>summary{font-size:.85rem;color:var(--muted)}
.dx[open]>summary{margin-bottom:6px}
#spsum2{display:none}
@media (max-width:600px){
  body{font-size:14px}
  .wrap{gap:12px;padding-block:12px 84px}
  h1{font-size:1.2rem}
  .meta{grid-template-columns:1fr 1fr;gap:8px}
  input{padding:6px 8px}
  .card{padding:12px;gap:8px}
  .tab{padding:8px 8px;font-size:.92rem}
  .sbtn{padding:10px 0}
  .bar-in{flex-wrap:nowrap;gap:8px}
  .score{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .score strong{font-size:1.05rem}
  .score .wide{display:none}
  .btn{padding:6px 10px;font-size:.82rem;white-space:nowrap}
  .btns{flex-wrap:nowrap;flex-shrink:0;gap:6px}
  #spsum{display:none}
  #spsum2{display:flex}
}
@media (prefers-reduced-motion:no-preference){.sbtn,.desc div{transition:background .12s}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>심평원 모의면접 평가표</h1>
    <p class="sub">행정직 6급가(일반) · SPIRIT 인재상 × 공고 면접 평가항목 기준</p>
  </header>

  <details class="metabox" id="metabox" open><summary id="metasum">면접 정보</summary>
  <section class="meta" aria-label="면접 정보">
    <label for="m-name">지원자<input id="m-name" placeholder="이름"></label>
    <label for="m-rater">평가자<input id="m-rater" placeholder="본인 / 스터디원"></label>
    <label for="m-date">날짜<input id="m-date" type="date"></label>
    <label for="m-topic">주제·과제<input id="m-topic" placeholder="PT 과제 / 토론 주제"></label>
  </section>
  </details>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="note" id="tabnote"></p>
  <div class="sp-sum" id="spsum2"></div>
  <div class="banner" id="sample" hidden>
    <span>PT면접 탭에는 사용 예시 점수가 들어 있어.</span>
    <button class="btn" id="clear-sample">예시 지우고 시작</button>
  </div>
  <div class="list" id="list"></div>

  <section class="card" id="result" hidden>
    <div class="top"><span class="item">결과 텍스트</span><span class="lv">엑셀에 붙여넣으면 칸이 나뉨(탭 구분)</span></div>
    <textarea class="out" id="out" readonly></textarea>
  </section>

  <footer>공식: 인재상 문구, 평가항목·우선순위, 60점 부적격 기준(공고 제2026-187호). 자체 설계: 인재상 연결(◎/○), 5·3·1점 지표, 질문 예시. 항목별 배점은 공고에 없어서 동일가중으로 계산함. 입력값은 이 브라우저에만 저장됨.</footer>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="score" id="score"></div>
    <div class="btns">
      <button class="btn primary" id="copy">결과 복사</button>
      <button class="btn danger" id="reset">초기화</button>
    </div>
    <div class="sp-sum" id="spsum"></div>
  </div>
</div>

function calc(tid){
  const t=TABS.find(x=>x.id===tid); const vals=t.rows.map(r=>S.sc[tid][r.id]).filter(Boolean);

  return {n:vals.length,total:t.rows.length,avg,pct:avg==null?null:avg/5*100,sp};
}

  const b=e.target.closest(".sbtn"); if(!b) return;
  const rid=b.closest(".card").dataset.r, n=+b.dataset.n;
  if(S.sample){S.sample=false;}
  if(S.sc[S.tab][rid]===n) delete S.sc[S.tab][rid]; else S.sc[S.tab][rid]=n;
  save(); const y=scrollY; render(); scrollTo(0,y);
});
$("list").addEventListener("input",e=>{
  if(e.target.tagName!=="TEXTAREA") return;
  const rid=e.target.closest(".card").dataset.r; S.memo[S.tab][rid]=e.target.value; save();
});
$("list").addEventListener("toggle",e=>{const d=e.target; if(!d.classList||!d.classList.contains("dx")) return; const k=d.id.slice(3).replace("-",""); d.open?openDx.add(k):openDx.delete(k);},true);
function metaSum(){const m=S.meta; const s=[m.name,m.date,m.topic].filter(Boolean).join(" · "); $("metasum").textContent="면접 정보"+(s?" — "+s:"");}
if(!WIDE) $("metabox").open=false;
["name","rater","date","topic"].forEach(k=>$("m-"+k).addEventListener("input",metaSum)); metaSum();
$("clear-sample").addEventListener("click",()=>{S.sc.pt={}; S.sample=false; save(); render();});

let armed=false;
$("reset").addEventListener("click",()=>{
  const b=$("reset");
  if(!armed){armed=true; b.textContent="한 번 더 눌러 확인"; setTimeout(()=>{armed=false;b.textContent="초기화";},3000); return;}
  armed=false; b.textContent="초기화"; S.sc[S.tab]={}; S.memo[S.tab]={}; S.sample=false; save(); render();
});

function resultText(){
  const t=TABS.find(x=>x.id===S.tab), c=calc(S.tab), m=S.meta;
  const L=[];
  L.push(["면접","지원자","평가자","날짜","주제"].join("\t"));
  L.push([t.name,m.name||"",m.rater||"",m.date||"",m.topic||""].join("\t"));
  L.push("");
  L.push(["평가항목","인재상","연결","점수","메모"].join("\t"));
  t.rows.forEach(r=>L.push([r.item,r.sp,r.lv,S.sc[t.id][r.id]||"",(S.memo[t.id][r.id]||"").replace(/\s+/g," ")].join("\t")));
  L.push("");
  L.push(["평균(1~5)",c.avg==null?"-":c.avg.toFixed(2),"100점 환산",c.pct==null?"-":c.pct.toFixed(1)].join("\t"));
  SPS.forEach(k=>{ if(c.sp[k]!=null) L.push([k,c.sp[k].toFixed(2)].join("\t")); });
  return L.join("\n");
}
$("copy").addEventListener("click",()=>{
  const txt=resultText(); $("out").value=txt; $("result").hidden=false;
  const b=$("copy");
  const done=m=>{b.textContent=m; setTimeout(()=>b.textContent="결과 복사",2000);};
  try{
    navigator.clipboard.writeText(txt).then(()=>done("복사됨"),()=>{$("out").select(); done("아래 텍스트를 직접 복사");});
  }catch(e){$("out").select(); done("아래 텍스트를 직접 복사");}
});
render();
</script>

</body>
</html>
